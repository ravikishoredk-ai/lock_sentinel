<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock Sentinel Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; font-size: 18px; }
        .card { background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 550px; width: 100%; }
        h1 { margin-top: 0; color: #333; font-size: 2em; }
        #status-indicator { display: inline-block; padding: 15px 25px; border-radius: 30px; font-weight: bold; font-size: 1.3em; margin: 20px 0; color: white; transition: background-color 0.3s; }
        .safe { background-color: #10b981; }
        .grace { background-color: #f59e0b; }
        .triggered { background-color: #ef4444; }
        #countdown-timer { font-size: 3em; font-weight: bold; color: #f59e0b; margin: 15px 0; display: none; font-variant-numeric: tabular-nums; }
        img { max-width: 100%; border-radius: 8px; margin-top: 20px; display: none; border: 3px solid #ef4444; }
        button { background-color: #3b82f6; color: white; border: none; padding: 15px 24px; border-radius: 8px; font-size: 1.2em; cursor: pointer; font-weight: bold; width: 100%; margin-top: 25px; transition: background-color 0.2s; }
        button:hover { background-color: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Lock Sentinel Status</h1>
        <div id="status-indicator" class="safe">SAFE - MONITORING</div>
        <div id="countdown-timer">55</div>
        <img id="snapshot" src="" alt="Intruder Snapshot">
        <button onclick="disarmSystem()">DISARM SYSTEM</button>
    </div>

    <script>
        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
        const statusEl = document.getElementById('status-indicator');
        const timerEl = document.getElementById('countdown-timer');
        const imgEl = document.getElementById('snapshot');
        
        let graceInterval;

        function startStopwatch() {
            clearInterval(graceInterval);
            let timeLeft = 55;
            timerEl.style.display = "block";
            timerEl.textContent = timeLeft;
            
            graceInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(graceInterval);
                }
            }, 1000);
        }

        function stopStopwatch() {
            clearInterval(graceInterval);
            timerEl.style.display = "none";
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.state === "SAFE") {
                statusEl.className = "safe";
                statusEl.textContent = "SAFE - MONITORING";
                stopStopwatch();
            } else if (data.state === "GRACE_PERIOD") {
                statusEl.className = "grace";
                statusEl.textContent = "⚠️ GRACE PERIOD ACTIVE";
                startStopwatch(); 
            } else if (data.state === "TRIGGERED") {
                statusEl.className = "triggered";
                statusEl.textContent = "🚨 ALARM TRIGGERED";
                stopStopwatch();
            }

            if (data.image_url) {
                imgEl.src = data.image_url;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }
        };

        function disarmSystem() {
            fetch('/api/app/verify', { method: 'POST' });
        }
    </script>
</body>
</html>
