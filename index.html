<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock Sentinel Dashboard</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; border: 1px solid #334155; }
        h1 { font-size: 22px; margin-bottom: 8px; color: #94a3b8; letter-spacing: 1px; }
        
        .status-badge { display: inline-block; padding: 10px 20px; border-radius: 50px; font-weight: bold; font-size: 18px; margin: 15px 0; }
        .bg-idle { background: #065f46; color: #34d399; }
        .bg-pending { background: #9a3412; color: #fb923c; }
        .bg-verified { background: #1e3a8a; color: #60a5fa; }
        .bg-alarm { background: #881337; color: #f43f5e; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .timer { font-size: 52px; font-weight: 800; color: #f97316; margin: 10px 0; }
        
        .cam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .cam-box { background: #0f172a; border-radius: 8px; padding: 6px; border: 1px solid #334155; }
        .cam-box img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
        .cam-label { font-size: 12px; color: #64748b; margin-top: 4px; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 20px; }
        .btn-auth { background: #2563eb; color: white; }
        .btn-auth:active { background: #1d4ed8; }
        .hidden { display: none !important; }
        
        .control-btn { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h1>LOCK SENTINEL</h1>
        
        <button id="btnSoundTest" class="control-btn" onclick="testAudioUnlock()">🔊 Tap to Enable Alarm Sound</button>
        
        <div id="statusBadge" class="status-badge bg-idle">🛡️ ARMED</div>
        
        <div id="countdownBox" class="hidden">
            <div style="color: #94a3b8; font-size: 13px; letter-spacing: 0.5px;">GRACE WINDOW EXPIRING IN</div>
            <div id="timerText" class="timer">10</div>
        </div>

        <button id="btnAuth" class="btn btn-auth hidden" onclick="authenticateUser()">AUTHENTICATE & DISARM</button>

        <div id="camSection" class="cam-grid hidden">
            <div class="cam-box">
                <img id="imgDoor" src="" alt="Door Camera">
                <div class="cam-label">Door Camera</div>
            </div>
            <div class="cam-box">
                <img id="imgIndoor" src="" alt="Indoor Camera">
                <div class="cam-label">Indoor Camera</div>
            </div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let sirenInterval = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function testAudioUnlock() {
            initAudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);

            const btn = document.getElementById('btnSoundTest');
            btn.innerText = '✅ Alarm Audio Ready';
            btn.style.color = '#34d399';
            btn.style.borderColor = '#059669';
        }

        function playSirenSound() {
            if (sirenInterval) return;
            initAudioContext();

            let isHighTone = false;
            sirenInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.value = isHighTone ? 800 : 600;
                isHighTone = !isHighTone;

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            }, 400);
        }

        function stopSirenSound() {
            if (sirenInterval) {
                clearInterval(sirenInterval);
                sirenInterval = null;
            }
        }

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
        let socket;

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                updateUI(data);
            };

            socket.onclose = () => {
                setTimeout(connectWebSocket, 2000);
            };
        }

        function updateUI(data) {
            const badge = document.getElementById('statusBadge');
            const countdownBox = document.getElementById('countdownBox');
            const timerText = document.getElementById('timerText');
            const btnAuth = document.getElementById('btnAuth');
            const camSection = document.getElementById('camSection');

            if (data.state === 'IDLE') {
                stopSirenSound();
                badge.className = 'status-badge bg-idle';
                badge.innerText = '🛡️ ARMED';
                countdownBox.classList.add('hidden');
                btnAuth.classList.add('hidden');
                camSection.classList.add('hidden');
            } 
            else if (data.state === 'PENDING') {
                stopSirenSound();
                badge.className = 'status-badge bg-pending';
                badge.innerText = '⚠️ BREACH DETECTED';
                countdownBox.classList.remove('hidden');
                btnAuth.classList.remove('hidden');
                camSection.classList.add('hidden');
                timerText.innerText = data.grace_seconds_left;
            } 
            else if (data.state === 'VERIFIED') {
                stopSirenSound();
                badge.className = 'status-badge bg-verified';
                badge.innerText = '✅ ACCESS GRANTED';
                countdownBox.classList.add('hidden');
                btnAuth.classList.add('hidden');
                camSection.classList.add('hidden');
            } 
            else if (data.state === 'ALARM') {
                playSirenSound();
                badge.className = 'status-badge bg-alarm';
                badge.innerText = '🚨 INTRUSION ALARM!';
                countdownBox.classList.add('hidden');
                btnAuth.classList.add('hidden');
                camSection.classList.remove('hidden');

                if (data.door_img) document.getElementById('imgDoor').src = data.door_img + "?t=" + new Date().getTime();
                if (data.indoor_img) document.getElementById('imgIndoor').src = data.indoor_img + "?t=" + new Date().getTime();
            }
        }

        function authenticateUser() {
            initAudioContext();
            fetch('/api/app/verify', { method: 'POST' });
        }

        connectWebSocket();
    </script>
</body>
</html>
